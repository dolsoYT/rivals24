<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      padding: 12px 16px;
      background: #181818;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0f0f0f;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #cc0000; }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      background: #cc0000;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #a30000; }
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .player-area {
      flex: 2;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .results-area {
      flex: 1;
      min-width: 320px;
      max-width: 420px;
      background: #141414;
      border-left: 1px solid #2a2a2a;
      overflow-y: auto;
      padding: 12px;
    }
    .status {
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
    }
    .item {
      display: flex;
      gap: 10px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s;
    }
    .item:hover { background: #242424; }
    .item img {
      width: 130px;
      height: 74px;
      object-fit: cover;
      border-radius: 4px;
      background: #222;
      flex-shrink: 0;
    }
    .meta {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .channel {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }
    @media (max-width: 768px) {
      .main { flex-direction: column; }
      .player-area { flex: none; height: 42vh; }
      .results-area { max-width: none; border-left: none; border-top: 1px solid #2a2a2a; }
    }
  </style>
</head>
<body>
  <div class="header">
    <input id="query" placeholder="검색어 입력 또는 유튜브 URL / 영상 ID 붙여넣기" onkeydown="if(event.key==='Enter') handleSearch()">
    <button onclick="handleSearch()">검색 / 재생</button>
  </div>

  <div class="main">
    <div class="player-area">
      <iframe id="player" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
    <div class="results-area">
      <div id="status" class="status">검색어를 입력하면 목록이 표시됩니다.</div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    // 공개 검색 API 엔드포인트 목록 (일부 차단 시 순차 자동 시도)
    const API_INSTANCES = [
      { type: "piped", url: "https://pipedapi.kavin.rocks" },
      { type: "piped", url: "https://pipedapi.adminforge.de" },
      { type: "invidious", url: "https://inv.nadeko.net" },
      { type: "invidious", url: "https://invidious.nerdvpn.de" }
    ];

    function playVideo(videoId) {
      if (!videoId) return;
      document.getElementById("player").src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
    }

    async function handleSearch() {
      const input = document.getElementById("query").value.trim();
      if (!input) return;

      // 1. 직접 URL이나 11자리 영상 ID를 입력한 경우 바로 재생
      const idMatch = input.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|^)([a-zA-Z0-9_-]{11})(?:[?&/]|$)/);
      if (idMatch) {
        playVideo(idMatch[1]);
        document.getElementById("status").textContent = `영상 ID(${idMatch[1]}) 직접 재생 중`;
        return;
      }

      // 2. 검색어인 경우 API 호출
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      statusEl.textContent = "검색 중...";
      resultsEl.innerHTML = "";

      for (const instance of API_INSTANCES) {
        try {
          let items = [];
          if (instance.type === "piped") {
            const res = await fetch(`${instance.url}/search?q=${encodeURIComponent(input)}&filter=videos`);
            if (!res.ok) continue;
            const data = await res.json();
            items = (data.items || []).map(v => ({
              id: (v.url || "").replace("/watch?v=", ""),
              title: v.title,
              channel: v.uploaderName,
              thumb: v.thumbnail
            }));
          } else {
            const res = await fetch(`${instance.url}/api/v1/search?q=${encodeURIComponent(input)}&type=video`);
            if (!res.ok) continue;
            const data = await res.json();
            items = (data || []).map(v => ({
              id: v.videoId,
              title: v.title,
              channel: v.author,
              thumb: v.videoThumbnails?.[0]?.url || `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`
            }));
          }

          if (items.length > 0) {
            renderResults(items);
            statusEl.textContent = `검색 결과 ${items.length}건`;
            return;
          }
        } catch (e) {
          // 다음 서버로 자동 전환
        }
      }

      statusEl.textContent = "현재 공개 검색 서버 응답이 지연되고 있습니다. 유튜브 URL이나 11자리 ID를 직접 입력해 주세요.";
    }

    function renderResults(items) {
      const resultsEl = document.getElementById("results");
      resultsEl.innerHTML = "";
      items.forEach(item => {
        if (!item.id) return;
        const div = document.createElement("div");
        div.className = "item";
        div.onclick = () => playVideo(item.id);
        div.innerHTML = `
          <img src="${item.thumb}" alt="" loading="lazy">
          <div class="meta">
            <div class="title">${escapeHtml(item.title)}</div>
            <div class="channel">${escapeHtml(item.channel || "")}</div>
          </div>
        `;
        resultsEl.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
